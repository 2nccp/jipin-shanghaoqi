name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/jipin/shanghaoqi

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'JipinShanghaoqi'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.jipin.shanghaoqi'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.jipin.shanghaoqi'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="极品上号器"
                  android:allowBackup="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/jipin/shanghaoqi/MainActivity.java <<'EOF'
          package com.jipin.shanghaoqi;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.view.Gravity;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Button;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setGravity(Gravity.CENTER);
                  layout.setPadding(32, 32, 32, 32);
                  layout.setBackgroundColor(Color.rgb(245, 245, 245));

                  TextView title = new TextView(this);
                  title.setText("极品上号器");
                  title.setTextSize(28);
                  title.setTextColor(Color.BLACK);
                  title.setGravity(Gravity.CENTER);

                  TextView info = new TextView(this);
                  info.setText("官方授权登录工具\n\n请使用游戏官方提供的扫码或授权登录方式。");
                  info.setTextSize(16);
                  info.setTextColor(Color.DKGRAY);
                  info.setGravity(Gravity.CENTER);
                  info.setPadding(0, 40, 0, 40);

                  Button button = new Button(this);
                  button.setText("检测 Root 状态");
                  button.setOnClickListener(v -> {
                      new Thread(() -> {
                          String result;
                          try {
                              Process p = Runtime.getRuntime().exec(
                                  new String[]{"su", "-c", "id"}
                              );
                              int code = p.waitFor();
                              result = code == 0
                                  ? "检测到 Root 授权"
                                  : "未获得 Root 授权";
                          } catch (Exception e) {
                              result = "未检测到 Root 或无法执行检测";
                          }
                          final String msg = result;
                          runOnUiThread(() -> info.setText(msg));
                      }).start();
                  });

          

                  layout.addView(title);
                  layout.addView(info);
                  layout.addView(button);
                  setContentView(layout);
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JipinShanghaoqi-APK
          path: app/build/outputs/apk/debug/app-debug.apk
